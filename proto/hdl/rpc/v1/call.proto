edition = "2023";
package hdl.rpc.v1;
import "hdl/rpc/v1/types.proto";
option optimize_for = LITE_RUNTIME;

message ResolveExportRequest { string module = 1; string name = 2; }
message ResolveExportResponse { fixed64 address = 1; }
message CallExportRequest {
  string module = 1;
  string name = 2;
  repeated CallArgument arguments = 3;
  uint32 wait_timeout_ms = 4;
}
message CallExportResponse { CallResult result = 1; }
message CallRequest {
  fixed64 address = 1;
  repeated CallArgument arguments = 2;
  CallThreadMode thread_mode = 3;
  uint32 wait_timeout_ms = 4;
}
message CallResponse { CallResult result = 1; }
message CallVtableRequest {
  fixed64 object = 1;
  uint32 index = 2;
  repeated CallArgument arguments = 3;
  bool prepend_this = 4;
  CallThreadMode thread_mode = 5;
  uint32 wait_timeout_ms = 6;
}
message CallVtableResponse { CallResult result = 1; }
message GetCallStatusRequest { fixed64 call_id = 1; }
message GetCallStatusResponse { CallInfo call = 1; }
message AcknowledgeOrphanRequest { fixed64 call_id = 1; }
message AcknowledgeOrphanResponse { CallInfo call = 1; }
message EnumOrphansResponse { repeated CallInfo calls = 1; }
