name: Windows Nightly

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hosted-checks:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Zydis only, check: BackendZydis, runner: windows-2025-vs2026, vs: 18, timeout: 60, advisory: false}
          - {name: Capstone only, check: BackendCapstone, runner: windows-2025-vs2026, vs: 18, timeout: 60, advisory: false}
          - {name: AddressSanitizer, check: AsanHeadless, runner: windows-2025-vs2026, vs: 18, timeout: 60, advisory: false}
          - {name: clang-tidy, check: ClangTidy, runner: windows-2025-vs2026, vs: 18, timeout: 60, advisory: true}
          - {name: MSVC native analysis, check: MsvcAnalyze, runner: windows-2025-vs2026, vs: 18, timeout: 60, advisory: true}
          - {name: VS 2022 compatibility, check: WindowsCanary, runner: windows-2022, vs: 17, timeout: 60, advisory: true}
          - {name: Offline rebuild, check: OfflineBuild, runner: windows-2025-vs2026, vs: 18, timeout: 60, advisory: false}
          - {name: Extended fuzzing, check: FuzzExtended, runner: windows-2025-vs2026, vs: 18, timeout: 180, advisory: false}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\hdllib-tooling-cache
          key: tooling-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}
      - name: Run ${{ matrix.check }}
        env:
          HDL_EXPECTED_VS_MAJOR: ${{ matrix.vs }}
        run: >-
          ./tools/ci/run-checks.ps1 -Check ${{ matrix.check }}
          -ArtifactsDir "$env:RUNNER_TEMP\hdllib-${{ matrix.check }}-artifacts"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hdllib-${{ matrix.check }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: ${{ runner.temp }}/hdllib-${{ matrix.check }}-artifacts

  gui-checks:
    name: ${{ matrix.name }}
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    env:
      HDL_EXPECTED_VS_MAJOR: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: GUI lifecycle stress, check: GuiStress}
          - {name: ASan GUI lifecycle, check: AsanGuiLifecycle}
    concurrency:
      group: hdllib-interactive-gui-runner
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          persist-credentials: false
      - name: Run ${{ matrix.check }}
        run: ./tools/ci/run-checks.ps1 -Check ${{ matrix.check }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hdllib-${{ matrix.check }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: build/tooling/artifacts
