name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '43 8 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: C++ security analysis
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.3
        with:
          languages: c-cpp
          config-file: ./.github/codeql/codeql-config.yml
          # v4.37.3 embeds codeql-bundle-v2.26.1. The local runner validates
          # this against .github/codeql/toolchain.json before every analysis.
          # Force the same suite as tools/ci/run-codeql.ps1. Without `+`, this
          # overrides config `queries` — keep it identical to codeql-config.yml.
          queries: ./.github/codeql/hdllib-security-extended.qls

      - name: Configure
        run: >-
          cmake --preset ci-codeql
          "-DFETCHCONTENT_BASE_DIR=$env:RUNNER_TEMP\hdllib-fetchcontent"

      - name: Build
        run: cmake --build --preset ci-codeql --parallel

      - name: Analyze
        uses: github/codeql-action/analyze@v4.37.3
        with:
          category: /language:c-cpp
          wait-for-processing: true
