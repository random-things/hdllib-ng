name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '43 8 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: C++ security analysis
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    env:
      HDL_EXPECTED_VS_MAJOR: 18
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}\hdllib-tooling-cache\codeql
            ${{ runner.temp }}\hdllib-tooling-cache\fetchcontent
          key: codeql-${{ runner.os }}-${{ hashFiles('.github/codeql/toolchain.json', 'CMakeLists.txt') }}
      - name: Run pinned local CodeQL analysis
        run: >-
          ./tools/ci/run-checks.ps1 -Check CodeQL -Bootstrap
          -ArtifactsDir "$env:RUNNER_TEMP\hdllib-codeql-artifacts"
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4.37.3
        with:
          sarif_file: ${{ runner.temp }}\hdllib-codeql-artifacts\codeql\codeql-results.sarif
          category: /language:c-cpp
          wait-for-processing: true
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hdllib-codeql-results
          if-no-files-found: warn
          retention-days: 14
          path: ${{ runner.temp }}/hdllib-codeql-artifacts
