name: Windows CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-build:
    name: Fast build and headless tests
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    env:
      HDL_EXPECTED_VS_MAJOR: 18
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\hdllib-tooling-cache
          key: tooling-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'tools/ci/toolchain.json') }}
      - name: Run fast checks
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          ./tools/ci/run-checks.ps1 -Profile Fast
          -BaseRevision $env:BASE_REVISION
          -ArtifactsDir "$env:RUNNER_TEMP\hdllib-artifacts"
      - name: Upload release binaries and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hdllib-windows-x64-release
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/ci-windows/**/*.dll
            build/ci-windows/**/*.exe
            build/ci-windows/**/*.lib
            build/ci-windows/**/*.pdb
            ${{ runner.temp }}/hdllib-artifacts/logs/*.log
            ${{ runner.temp }}/hdllib-artifacts/summary.json

  fuzz-smoke:
    name: Fuzzer smoke tests
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    env:
      HDL_EXPECTED_VS_MAJOR: 18
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\hdllib-tooling-cache
          key: tooling-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}
      - name: Run fuzzer smoke checks
        run: >-
          ./tools/ci/run-checks.ps1 -Check FuzzSmoke
          -ArtifactsDir "$env:RUNNER_TEMP\hdllib-fuzz-artifacts"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hdllib-fuzz-smoke
          if-no-files-found: warn
          retention-days: 14
          path: ${{ runner.temp }}/hdllib-fuzz-artifacts

  coverage:
    name: First-party source coverage
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    env:
      HDL_EXPECTED_VS_MAJOR: 18
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\hdllib-tooling-cache
          key: tooling-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}
      - name: Run coverage gate
        run: >-
          ./tools/ci/run-checks.ps1 -Check Coverage
          -ArtifactsDir "$env:RUNNER_TEMP\hdllib-coverage-artifacts"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hdllib-coverage
          if-no-files-found: warn
          retention-days: 14
          path: ${{ runner.temp }}/hdllib-coverage-artifacts

  gui-tests:
    name: GUI and injection tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: hosted-build
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    env:
      HDL_EXPECTED_VS_MAJOR: 18
    concurrency:
      group: hdllib-interactive-gui-runner
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          persist-credentials: false
      - name: Run GUI smoke checks
        run: ./tools/ci/run-checks.ps1 -Check GuiSmoke
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hdllib-gui-test-log-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: build/tooling/artifacts
