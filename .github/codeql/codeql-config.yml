name: hdllib CodeQL configuration

# Build mode "none" applies these filters during extraction. The manual fallback
# still filters third-party results from SARIF in tools/ci/run-codeql.ps1.
paths-ignore:
  - build/**
  - third_party/**
  # Build-only generator: buildless extraction cannot resolve libprotoc headers.
  - tools/rpc_codegen/**

queries:
  - uses: ./.github/codeql/hdllib-security-extended.qls

# Applied by github/codeql-action even if the .qls exclude is ignored.
query-filters:
  - exclude:
      id: cpp/uncontrolled-process-operation
